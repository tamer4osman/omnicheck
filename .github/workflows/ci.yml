name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.cc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vendor tree-sitter sources
        run: ./scripts/vendor.sh
      - name: Configure (warnings as errors)
        run: cmake --preset default -DOC_WERROR=ON
      - name: Build
        run: cmake --build --preset default -j
      - name: Test
        run: ctest --preset default

  sanitizers:
    name: Sanitizers (ASan+UBSan+LSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/vendor.sh
      - name: Configure ASan+UBSan (warnings as errors)
        run: cmake --preset sanitize -DOC_WERROR=ON
      - name: Build
        run: cmake --build --preset sanitize -j
      - name: Test (leak detection on)
        run: ctest --preset sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format-19
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/$(. /etc/os-release && echo $UBUNTU_CODENAME)/llvm-toolchain-$(. /etc/os-release && echo $UBUNTU_CODENAME)-19 apt main" | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list
          sudo apt-get update
          sudo apt-get install -y clang-format-19
      - name: Check formatting
        run: PATH="/usr/lib/llvm-19/bin:$PATH" ./scripts/check-format.sh